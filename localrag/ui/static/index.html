<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalRAG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Pantalla de login (visible por defecto) -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>LocalRAG</h1>
            <p>Ingresá tus credenciales</p>
            <input type="text" id="loginUser" placeholder="Usuario" />
            <input type="password" id="loginPass" placeholder="Contraseña" />
            <button onclick="login()">Ingresar</button>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <!-- App principal (oculta hasta login) -->
    <div id="appScreen" class="container" style="display:none">
        <div class="panel chat-panel">
            <div class="panel-header">
                <h1>LocalRAG</h1>
                <!-- Rol mostrado como info, ya no editable -->
                <span id="rolBadge" class="rol-badge"></span>
                <span class="status-dot" id="statusDot"></span>
                <button onclick="logout()" class="logout-btn">Salir</button>
            </div>
            <div class="messages" id="messages">
                <div class="message assistant">
                    Hola, soy tu asistente local. Subí documentos a la derecha y haceme preguntas sobre ellos.
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" placeholder="Hacé una pregunta..." rows="2"></textarea>
                <button id="sendBtn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>

        <div class="panel docs-panel">
            <div class="panel-header">
                <h2>Documentos</h2>
            </div>
            <div class="upload-area">
                <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.csv,.txt" onchange="uploadFile(this)">
                <label for="fileInput" class="upload-btn">+ Subir documento</label>
            </div>
            <div class="doc-list" id="docList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
