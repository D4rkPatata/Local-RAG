<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Pantalla de login (visible por defecto) -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="brand">
                <span class="brand-logo">N</span>
                <h1>NexusChat</h1>
            </div>
            <p class="login-sub">Asistente interno de Nexus Solutions</p>
            <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username" />
            <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" />
            <button onclick="login()">Ingresar</button>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <!-- App principal (oculta hasta login) -->
    <div id="appScreen" class="container" style="display:none">
        <div class="panel chat-panel">
            <div class="panel-header">
                <div class="brand">
                    <span class="brand-logo">N</span>
                    <h1>NexusChat</h1>
                </div>
                <span id="rolBadge" class="rol-badge"></span>
                <button onclick="logout()" class="logout-btn">Salir</button>
            </div>
            <div class="messages" id="messages">
                <div class="message assistant">
                    Hola, soy la asistente de Nexus Solutions. Pregúntame lo que necesites sobre los documentos de la empresa.
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" placeholder="Escribe tu pregunta..." rows="2"></textarea>
                <button id="sendBtn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>

        <div class="panel docs-panel" id="docsPanel">
            <div class="panel-header">
                <h2>Documentos</h2>
            </div>
            <div class="upload-area">
                <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.csv,.txt" onchange="uploadFile(this)">
                <label for="fileInput" class="upload-btn">+ Subir documento</label>
            </div>
            <div class="doc-list" id="docList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
